name: Bug report
description: Report incorrect validation, telemetry, or CLI behavior
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the unexpected behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code or new-body CLI steps to reproduce.
      render: python
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, package version (pip show new-body), relevant hardware config.
